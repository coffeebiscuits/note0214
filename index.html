<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>note0214</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen font-sans">
  <!-- 헤더 -->
  <header class="bg-indigo-600 text-white py-6 shadow-md">
    <h1 class="text-center text-2xl font-bold tracking-wide">
      note0214 · 나만의 집중 & 습관 코치
    </h1>
  </header>

  <!-- 컨테이너 -->
  <main class="max-w-2xl mx-auto mt-10 bg-white rounded-xl shadow-lg p-8 space-y-8">
    
    <!-- 집중 타이머 -->
    <section>
      <h2 class="text-xl font-semibold text-indigo-600 flex items-center gap-2">
        ⏱ 집중 타이머
      </h2>
      <div class="mt-4 flex gap-4">
        <button id="startBtn" class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-700 transition">
          시작
        </button>
        <button id="stopBtn" class="px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-600 transition">
          종료
        </button>
      </div>
      <div id="timerOutput" class="mt-4 p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-gray-700"></div>
    </section>

    <!-- 습관 기록 -->
    <section>
      <h2 class="text-xl font-semibold text-indigo-600 flex items-center gap-2">
        📌 습관 기록
      </h2>
      <div class="mt-4 flex gap-2">
        <input type="text" id="habitInput" placeholder="오늘의 습관 입력"
          class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <button id="saveHabitBtn" class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-700 transition">
          저장
        </button>
      </div>
      <div id="habitOutput" class="mt-4 p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-gray-700"></div>
    </section>

    <!-- AI 피드백 -->
    <section>
      <h2 class="text-xl font-semibold text-indigo-600 flex items-center gap-2">
        🤖 AI 피드백
      </h2>
      <textarea id="feedbackInput" placeholder="오늘의 상태를 적어보세요"
        class="w-full mt-4 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
      <button id="getFeedbackBtn" class="mt-4 px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-700 transition">
        피드백 받기
      </button>
      <div id="feedbackOutput" class="mt-4 p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-gray-700"></div>
    </section>
  </main>

  <script>
    let startTime;

    // 집중 타이머
    document.getElementById("startBtn").onclick = () => {
      startTime = new Date();
      document.getElementById("timerOutput").innerText = "집중 시작: " + startTime.toLocaleTimeString();
    };

    document.getElementById("stopBtn").onclick = () => {
      if (!startTime) return;
      const endTime = new Date();
      const duration = Math.round((endTime - startTime) / 1000);
      document.getElementById("timerOutput").innerText =
        "집중 종료: " + endTime.toLocaleTimeString() + " (총 " + duration + "초)";
      startTime = null;
    };

    // 습관 기록
    document.getElementById("saveHabitBtn").onclick = () => {
      const habit = document.getElementById("habitInput").value;
      if (!habit) return;
      document.getElementById("habitOutput").innerText = "오늘 기록된 습관: " + habit;
      document.getElementById("habitInput").value = "";
    };

    // AI 피드백 (FastAPI 호출)
    document.getElementById("getFeedbackBtn").onclick = async () => {
      const text = document.getElementById("feedbackInput").value;
      if (!text) return;
      const res = await fetch("https://YOUR_FASTAPI_SERVER/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input: text })
      });
      const data = await res.json();
      document.getElementById("feedbackOutput").innerText = "AI 피드백: " + data.feedback;
    };
  </script>
</body>
</html>
