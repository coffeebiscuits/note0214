<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartNote Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "paper-bg": "#F9F9F7",
            "paper-card": "#ffffff",
            "ink-primary": "#2c3e50",
            "ink-secondary": "#57606f",
            "accent-blue": "#34495e",
            "accent-highlight": "#f1c40f",
            "line-rule": "#e0e0e0",
            "binder-ring": "#bdc3c7",
          },
          fontFamily: {
            serif: ["Crimson Pro", "serif"],
            sans: ["Nunito", "sans-serif"]
          },
          boxShadow: {
            paper: "0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24)",
            floating: "0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22)",
          },
          backgroundImage: {
            "lined-paper": "linear-gradient(#e0e0e0 1px, transparent 1px)",
            "grid-paper": "radial-gradient(#e0e0e0 1px, transparent 1px)"
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F9F9F7;
      background-image: radial-gradient(#d1d5db 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .notebook-tab {
      position: relative;
      z-index: 1;
      transition: all 0.2s ease;
      border-radius: 8px 8px 0 0;
      margin-right: 4px;
      border: 1px solid #e5e7eb;
      border-bottom: none;
    }

    .notebook-tab:hover {
      transform: translateY(-2px);
    }

    .notebook-tab.active {
      background-color: #F9F9F7;
      border-color: #d1d5db;
      font-weight: 700;
      z-index: 10;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
    }

    .hand-underline {
      position: relative;
      display: inline-block;
    }

    .hand-underline::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 3px;
      bottom: -2px;
      left: 0;
      opacity: 0.7;
    }
  </style>
</head>

<body class="text-ink-primary font-sans antialiased min-h-screen flex flex-col pt-4">

  <!-- ================= NAV ================= -->
  <nav class="sticky top-0 z-50 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between border-b border-gray-300 bg-white/80 backdrop-blur-sm rounded-t-lg shadow-sm px-4 pt-4">

      <!-- Left -->
      <div class="flex items-end gap-8 w-full">
        <div class="flex items-center gap-2 pb-3 mr-4">
          <span class="material-symbols-outlined text-3xl text-ink-primary">menu_book</span>
          <span class="font-serif font-bold text-2xl tracking-tight">SmartNote</span>
        </div>

        <div class="hidden md:flex flex-grow items-end h-full">
          <a class="notebook-tab active px-6 py-3 font-serif bg-white" href="#">Dashboard</a>
          <a class="notebook-tab px-6 py-3 font-serif bg-gray-100" href="#">Journal</a>
          <a class="notebook-tab px-6 py-3 font-serif bg-gray-100" href="#">Planner</a>
          <a class="notebook-tab px-6 py-3 font-serif bg-gray-100" href="#">Archives</a>
        </div>
      </div>

      <!-- Right -->
      <div class="flex items-center gap-4 pb-3">
        <button class="relative">
          <span class="material-symbols-outlined">notifications</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- ================= MAIN ================= -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full bg-paper-bg shadow-xl min-h-[calc(100vh-80px)] border-x border-gray-200">

    <!-- Header -->
    <header class="mb-10 border-b-2 border-dotted border-gray-300 pb-6">
      <h1 class="text-4xl font-serif font-bold">
        Good Morning, <span class="hand-underline">Alex</span>
      </h1>
      <p class="mt-2 font-serif italic">
        "The secret of getting ahead is getting started."
      </p>
    </header>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-8">

      <!-- Focus Log -->
      <section class="lg:col-span-4 bg-white shadow-paper border p-6">
        <h2 class="text-xl font-serif font-bold mb-4">Focus Log</h2>
        <div class="text-center">
          <span class="text-2xl font-bold">4h 12m</span>
          <p class="text-sm italic">Recorded</p>
        </div>
      </section>

      <!-- Habit Tracker -->
      <section class="lg:col-span-8 bg-white shadow-paper border p-6">
        <h2 class="text-xl font-serif font-bold mb-6">Habit Tracker</h2>
      </section>

    </div>
  </main>
</body>
</html>
