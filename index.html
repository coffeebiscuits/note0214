<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Focus & Habit Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
    h1 { color: #333; }
    .section { margin-bottom: 30px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
    .output { margin-top: 15px; padding: 10px; background: #eee; }
  </style>
</head>
<body>
  <h1>나만의 집중 & 습관 코치</h1>

  <!-- 집중 타이머 -->
  <div class="section">
    <h2>집중 타이머</h2>
    <button id="startBtn">시작</button>
    <button id="stopBtn">종료</button>
    <div id="timerOutput" class="output"></div>
  </div>

  <!-- 습관 기록 -->
  <div class="section">
    <h2>습관 기록</h2>
    <input type="text" id="habitInput" placeholder="오늘의 습관 입력" />
    <button id="saveHabitBtn">저장</button>
    <div id="habitOutput" class="output"></div>
  </div>

  <!-- AI 피드백 -->
  <div class="section">
    <h2>AI 피드백</h2>
    <textarea id="feedbackInput" placeholder="오늘의 상태를 적어보세요"></textarea>
    <button id="getFeedbackBtn">피드백 받기</button>
    <div id="feedbackOutput" class="output"></div>
  </div>

  <script>
    let startTime;

    // 집중 타이머
    document.getElementById("startBtn").onclick = () => {
      startTime = new Date();
      document.getElementById("timerOutput").innerText = "집중 시작: " + startTime.toLocaleTimeString();
    };

    document.getElementById("stopBtn").onclick = () => {
      if (!startTime) return;
      const endTime = new Date();
      const duration = Math.round((endTime - startTime) / 1000);
      document.getElementById("timerOutput").innerText =
        "집중 종료: " + endTime.toLocaleTimeString() + " (총 " + duration + "초)";
      startTime = null;
    };

    // 습관 기록
    document.getElementById("saveHabitBtn").onclick = () => {
      const habit = document.getElementById("habitInput").value;
      if (!habit) return;
      document.getElementById("habitOutput").innerText = "오늘 기록된 습관: " + habit;
      document.getElementById("habitInput").value = "";
    };

    // AI 피드백 (FastAPI 호출)
    document.getElementById("getFeedbackBtn").onclick = async () => {
      const text = document.getElementById("feedbackInput").value;
      if (!text) return;
      const res = await fetch("https://YOUR_FASTAPI_SERVER/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input: text })
      });
      const data = await res.json();
      document.getElementById("feedbackOutput").innerText = "AI 피드백: " + data.feedback;
    };
  </script>
</body>
</html>
