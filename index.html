<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>note0214</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
  <!-- 헤더 -->
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-6 shadow-lg">
    <h1 class="text-center text-3xl font-bold">note0214</h1>
    <p class="text-center text-sm opacity-80">집중 · 습관 · 기억 · 피드백</p>
  </header>

  <!-- 네비게이션 -->
  <nav class="flex justify-center gap-8 bg-white shadow-md py-4 sticky top-0 z-10">
    <button class="tab-btn text-indigo-600 font-semibold" data-tab="dashboard">대시보드</button>
    <button class="tab-btn text-gray-600 hover:text-indigo-600" data-tab="focus">집중</button>
    <button class="tab-btn text-gray-600 hover:text-indigo-600" data-tab="habit">습관</button>
    <button class="tab-btn text-gray-600 hover:text-indigo-600" data-tab="memory">기억</button>
    <button class="tab-btn text-gray-600 hover:text-indigo-600" data-tab="feedback">피드백</button>
  </nav>

  <!-- 컨텐츠 -->
  <main class="max-w-6xl mx-auto mt-10 px-6">
    <!-- 대시보드 -->
    <section id="dashboard" class="tab-content">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition">
          <h2 class="text-xl font-semibold text-indigo-600 mb-4">오늘의 집중</h2>
          <p class="text-gray-700">총 집중 시간: 120분</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition">
          <h2 class="text-xl font-semibold text-green-600 mb-4">습관 달성률</h2>
          <p class="text-gray-700">오늘 달성: 3/5</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition">
          <h2 class="text-xl font-semibold text-blue-600 mb-4">기억 요약</h2>
          <p class="text-gray-700">“오늘은 집중이 잘 되었고, 습관도 꾸준히 이어갔다.”</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition">
          <h2 class="text-xl font-semibold text-gray-600 mb-4">AI 피드백</h2>
          <p class="text-gray-700">“오늘의 집중 패턴은 안정적입니다. 내일은 습관을 조금 더 강화해보세요.”</p>
        </div>
      </div>
    </section>

    <!-- 집중 관리 -->
    <section id="focus" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition">
        <h2 class="text-2xl font-semibold text-indigo-600 mb-6">⏱ 집중 관리</h2>
        <div class="flex gap-4">
          <button id="startBtn" class="px-6 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-700 transition">시작</button>
          <button id="stopBtn" class="px-6 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-600 transition">종료</button>
        </div>
        <div id="timerOutput" class="mt-6 p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-gray-700"></div>
      </div>
    </section>

    <!-- 습관 형성 -->
    <section id="habit" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition">
        <h2 class="text-2xl font-semibold text-green-600 mb-6">📌 습관 형성</h2>
        <div class="flex gap-3">
          <input type="text" id="habitInput" placeholder="오늘의 습관 입력"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400" />
          <button id="saveHabitBtn" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-700 transition">저장</button>
        </div>
        <div id="habitOutput" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-gray-700"></div>
      </div>
    </section>

    <!-- 기억 정리 -->
    <section id="memory" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition">
        <h2 class="text-2xl font-semibold text-blue-600 mb-6">📝 기억 정리</h2>
        <textarea id="memoryInput" placeholder="오늘 하루를 기록해보세요"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"></textarea>
        <button id="saveMemoryBtn" class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-700 transition">저장</button>
        <div id="memoryOutput" class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg text-gray-700"></div>
      </div>
    </section>

    <!-- 자기 피드백 -->
    <section id="feedback" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition">
        <h2 class="text-2xl font-semibold text-gray-600 mb-6">🤖 자기 피드백</h2>
        <textarea id="feedbackInput" placeholder="오늘의 상태를 적어보세요"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"></textarea>
        <button id="getFeedbackBtn" class="mt-4 px-6 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-700 transition">피드백 받기</button>
        <div id="feedbackOutput" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-700"></div>
      </div>
    </section>
  </main>

  <script>
    // 탭 전환
    const tabs = document.querySelectorAll(".tab-btn");
    const contents = document.querySelectorAll(".tab-content");
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("text-indigo-600", "font-semibold"));
        tab.classList.add("text-indigo-600", "font-semibold");
        contents.forEach(c => c.classList.add("hidden"));
        document.getElementById(tab.dataset.tab).classList.remove("hidden");
      });
    });

    let startTime;

    // 집중 타이머
    document.getElementById("startBtn").onclick = () => {
      startTime = new Date();
      document.getElementById("timerOutput").innerText = "집중 시작: " + startTime.toLocaleTimeString();
    };
    document.getElementById("stopBtn").onclick = () => {
      if (!startTime) return;
      const endTime = new Date();
      const duration = Math.round((endTime - startTime) / 1000);
      document.getElementById("timerOutput").innerText =
        "집중 종료: " + endTime.toLocaleTimeString() + " (총 " + duration + "초)";
      startTime = null;
    };

    // 습관 기록
    document.getElementById("saveHabitBtn").onclick = () => {
      const habit = document.getElementById("habitInput").value;
      if (!habit) return;
      document.getElementById("habitOutput").innerText = "오늘 기록된 습관: " + habit;
      document.getElementById("habitInput").value = "";
    };

    // 기억 정리
    document.getElementById("saveMemoryBtn").onclick = () => {
      const memory = document.getElementById("memoryInput").value;
      if (!memory) return;
      document.getElementById("memoryOutput").innerText = "오늘의 기록: " + memory;
      document.getElementById("memoryInput").value
